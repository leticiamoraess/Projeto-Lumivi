<!-- sala_interface.html -->
<!-- Interface de usuário para criação e gerenciamento de salas -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Salas - Lumivi</title>
  <link rel="stylesheet" href="sala_interface.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="alertas.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Gerenciamento de Salas</h1>
    </header>

    <div class="content">
      <!-- Seção de criação de sala -->
      <section class="create-room-section">
        <h2>Criar Nova Sala</h2>
        <form id="createRoomForm">
          <div class="form-group">
            <label for="roomName">Nome da Sala</label>
            <input type="text" id="roomName" required>
          </div>

          <div class="form-group">
            <label for="roomCapacity">Capacidade Máxima</label>
            <input type="number" id="roomCapacity" value="50" min="1" max="1000">
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="requireApproval"> 
              Exigir aprovação para novos membros
            </label>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="allowCodeJoin" checked> 
              Permitir entrada por código
            </label>
          </div>

          <div class="form-group">
            <label for="calendarPermissions">Permissões do Calendário</label>
            <select id="calendarPermissions">
              <option value="anyone">Qualquer membro</option>
              <option value="admins_only" selected>Apenas administradores</option>
              <option value="specific_roles">Cargos específicos</option>
            </select>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="chatOpen" checked> 
              Permitir chat aberto
            </label>
          </div>

          <button type="submit" class="btn-primary">Criar Sala</button>
        </form>
      </section>

      <!-- Seção de entrada em sala -->
      <section class="join-room-section">
        <h2>Entrar em Sala Existente</h2>
        <div class="form-group">
          <label for="roomCode">Código da Sala</label>
          <input type="text" id="roomCode" placeholder="Digite o código de 8 caracteres" maxlength="8">
        </div>
        <button id="joinRoomBtn" class="btn-secondary">Entrar na Sala</button>
      </section>

      <!-- Seção de exibição de salas do usuário -->
      <section class="user-rooms-section">
        <h2>Suas Salas</h2>
        <div id="userRoomsList">
          <p>Carregando suas salas...</p>
        </div>
      </section>
    </div>

    <div class="back-button-container">
      <a href="pagina-principal/pagina-principal.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Voltar para a Página Principal
      </a>
    </div>
  </div>

  <!-- Modal para exibir mensagens -->
  <div id="messageModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p id="messageText"></p>
    </div>
  </div>

  <script type="module" src="sala_interface.js"></script>
</body>
</html>
